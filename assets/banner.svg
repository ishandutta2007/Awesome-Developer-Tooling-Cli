<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .terminal-prompt {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #34d399;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #f8fafc;
      }

      /* Dynamic Animations (SMIL + CSS fallback) */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes driftOrbit {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      .glow-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 220px 110px;
      }
      .glow-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 1020px 220px;
      }
      .cursor-blink {
        animation: blinkCursor 1s step-end infinite;
      }
      .floating-card {
        animation: driftOrbit 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="glow-1" cx="220" cy="110" r="240" fill="url(#glow-cyan)">
    <animate attributeName="r" values="220;260;220" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle class="glow-2" cx="1020" cy="220" r="260" fill="url(#glow-purple)">
    <animate attributeName="r" values="260;230;260" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Cybernetic Grid Pattern -->
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Floating Dynamic Laser Beams (SMIL-driven for universal GitHub / browser rendering) -->
  <g opacity="0.6">
    <line x1="-300" y1="50" x2="50" y2="50" stroke="url(#primary-grad)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="-300;1200" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="50;1550" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="-300" y1="290" x2="50" y2="290" stroke="url(#primary-grad)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="-300;1200" dur="8s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="50;1550" dur="8s" begin="2s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Interactive Terminal Snippet Card (Side Graphic, Background Layer) -->
  <g class="floating-card" transform="translate(860, 65)">
    <rect width="280" height="200" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#eab308" />
    <circle cx="52" cy="20" r="5" fill="#22c55e" />
    <line x1="0" y1="36" x2="280" y2="36" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="65" class="terminal-prompt">$ <tspan fill="#e2e8f0">gh repo clone</tspan></text>
    <text x="20" y="95" class="terminal-prompt">$ <tspan fill="#38bdf8">terraform</tspan> <tspan fill="#e2e8f0">apply</tspan></text>
    <text x="20" y="125" class="terminal-prompt">$ <tspan fill="#c084fc">k9s</tspan> <tspan fill="#64748b">--all-namespaces</tspan></text>
    <text x="20" y="155" class="terminal-prompt">$ <tspan fill="#38bdf8">uv</tspan> <tspan fill="#e2e8f0">run</tspan> devtool <rect x="145" y="144" width="8" height="13" fill="#38bdf8" class="cursor-blink"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></rect></text>
  </g>

  <!-- Foreground Content: Title, Subtitle, Badges (Guaranteed Foreground Visibility) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="30" y="21" class="badge-text">⚡ CLI &amp; DEVOPS TOOLING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text" fill="url(#primary-grad)">
      Awesome Developer Tooling CLI
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="185" class="subtitle-text">
      The Curated Ecosystem of Command-Line Interfaces, Cloud SDKs &amp; DevOps Terminals
    </text>

    <!-- Tech Stack Feature Pills (Clean text with standard SVGs) -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">Cloud CLIs</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">Developer TUI</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(314, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">Modern Rust/Go</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(491, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="pill-text">SaaS &amp; OSS</text>
      </g>
    </g>
  </g>
</svg>
